<!-- Vertriebsteam: Portraits im Kreis und zwei Zeilen Text. Einbauen mit
     einem einbau-Kommentar fuer vertriebsteam.html (Syntax in CLAUDE.md),
     auf jeder Seite gleich. Abstand nach
     oben/unten setzt die Seite drumherum. Fuer helle Flaechen gemacht
     (blaue Schrift). Aussehen und Wachsen beim Hovern: .kontakt-koepfe /
     .kontakt-kopf in tailwind/input.css.
     Neue Person: eine <img>-Zeile mehr (Bild 1000 x 1000 nach
     images/mitarbeiter/) und die Anzahl im Text anpassen. -->
          <div class="vertriebsteam flex flex-wrap items-center gap-x-6 gap-y-4">
            <div class="kontakt-koepfe">
              <img src="images/mitarbeiter/bernd.webp" alt="" width="200" height="200" class="kontakt-kopf" decoding="async">
              <img src="images/mitarbeiter/eric.webp" alt="" width="200" height="200" class="kontakt-kopf" decoding="async">
            </div>
            <div>
              <p class="vertriebsteam-name t-body font-bold text-blue-600">Unser Vertriebsteam</p>
              <p class="vertriebsteam-text mt-1 t-body-tight text-ink/85">Zwei Ansprechpersonen für Ihre Anfrage</p>
            </div>
          </div>
