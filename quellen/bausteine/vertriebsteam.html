<!-- Vertriebsteam: Portraits im Kreis und zwei Zeilen Text. Einbauen mit
     einem einbau-Kommentar fuer vertriebsteam.html (Syntax in CLAUDE.md),
     auf jeder Seite gleich. Abstand nach
     oben/unten setzt die Seite drumherum. Fuer helle Flaechen gemacht
     (blaue Schrift). Aussehen und Wachsen beim Hovern: .kontakt-koepfe /
     .kontakt-kopf in tailwind/input.css.
     Die Namen stehen in der Reihenfolge der Bilder, von links nach rechts.
     Neue Person: eine <img>-Zeile mehr (Bild 1000 x 1000 nach
     images/mitarbeiter/) und den Namen in der fetten Zeile ergaenzen. -->
          <div class="vertriebsteam flex items-center gap-x-5 sm:gap-x-6">
            <div class="kontakt-koepfe">
              <img src="images/mitarbeiter/bernd.webp" alt="" title="Bernd Vasen" width="200" height="200" class="kontakt-kopf" decoding="async">
              <img src="images/mitarbeiter/eric.webp" alt="" title="Eric Uerkwitz" width="200" height="200" class="kontakt-kopf" decoding="async">
            </div>
            <div>
              <p class="vertriebsteam-name t-body font-bold text-blue-600">Bernd&nbsp;Vasen und Eric&nbsp;Uerkwitz</p>
              <p class="vertriebsteam-text mt-1 t-body-tight text-ink/85">Ihre Ansprechpersonen im Vertrieb</p>
            </div>
          </div>
